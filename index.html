<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efeee8">
<title>YikeBeads · NFC Preview</title>
<style>
:root{
  --bg:#efeee8;
  --ink:#353a34;
  --muted:#7c8179;
  --line:rgba(53,58,52,.10);
  --glass:rgba(255,255,255,.58);
  --sage:#879383;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-snap-type:y mandatory}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.screen{
  min-height:100svh; height:100svh; scroll-snap-align:start;
  position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  padding:calc(28px + env(safe-area-inset-top)) 24px calc(26px + env(safe-area-inset-bottom));
}
.inner{width:min(100%,430px);margin:auto}
.bead{position:absolute;width:14px;height:14px;border:2px solid currentColor;border-radius:50%;opacity:.07}
.b1{left:-4px;top:17%;color:#7e8d79}.b2{right:7%;top:12%;width:10px;height:10px;color:#b59d8f}
.b3{left:10%;bottom:16%;width:11px;height:11px;color:#9b9a84}.b4{right:-5px;bottom:28%;color:#7f8d88}
.b5{left:4%;top:58%;width:8px;height:8px;color:#baa58f}.b6{right:13%;top:50%;width:9px;height:9px;color:#8e9a84}

.logo{
  width:94px;height:94px;margin:0 auto 44px;border-radius:50%;
  border:1.5px solid rgba(83,89,79,.22);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#6f796d;background:rgba(255,255,255,.26);
  letter-spacing:.04em;
}
.logo strong{font-family:Georgia,"Times New Roman",serif;font-size:15px;font-weight:500}
.logo small{font-size:7px;margin-top:4px;letter-spacing:.12em}
.welcome{text-align:center;font-size:14px;color:var(--muted);letter-spacing:.035em;margin:0}
.hero-copy{width:292px;margin:52px auto 0;font-family:"Songti SC","STSong",Georgia,serif}
.hero-line{font-size:41px;line-height:1.32;font-weight:500;letter-spacing:.01em}
.hero-line.one{text-align:left}
.hero-line.two{text-align:right;margin-top:8px}
.secret-link{position:relative;display:inline-block;cursor:pointer;transition:color .22s ease,transform .18s ease;text-decoration:none;-webkit-tap-highlight-color:transparent}
.secret-link::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:rgba(126,143,128,.18);transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none}
.secret-link.is-active{color:#7f8f80;transform:scale(.97)}
.secret-link.is-active::after{animation:ripple .55s ease-out forwards}
@keyframes ripple{0%{transform:translate(-50%,-50%) scale(.2);opacity:.5}100%{transform:translate(-50%,-50%) scale(8);opacity:0}}
.weather{text-align:center;margin-top:58px;color:#878c84;font-size:14px;letter-spacing:.03em}
.weather .temp{font-family:Georgia,serif;font-size:18px;color:#697067;margin-left:8px}

.second .inner{display:flex;flex-direction:column;justify-content:center;height:100%}
.wifi{
  width:100%;padding:28px 26px 25px;border-radius:28px;
  background:linear-gradient(145deg,rgba(255,255,255,.72),rgba(255,255,255,.42));
  border:1px solid rgba(255,255,255,.72);
  box-shadow:0 18px 55px rgba(71,75,68,.08);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.eyebrow{margin:0 0 16px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#90958d}
.network{font-family:Georgia,serif;font-size:27px;margin:0 0 24px;font-weight:400}
.row{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:18px}
.password{font-size:20px;letter-spacing:.12em}
.actions{display:flex;gap:8px}
button{
  border:0;background:rgba(112,123,108,.10);color:#687265;
  border-radius:999px;padding:9px 12px;font-size:12px;cursor:pointer
}
.tips{margin-top:108px;padding:0 4px}
.tips h2{font-family:"Songti SC","STSong",Georgia,serif;font-size:23px;font-weight:500;margin:0 0 24px}
.tip{display:grid;grid-template-columns:22px 1fr;gap:14px;padding:12px 0;color:#636962;font-size:15px;line-height:1.6}
.tip + .tip{border-top:1px solid rgba(53,58,52,.06)}
.dot{width:7px;height:7px;border:1.5px solid #879383;border-radius:50%;margin-top:7px;opacity:.7}

.hidden .inner{text-align:center;display:flex;flex-direction:column;align-items:center}
.heart{font-size:19px;margin-bottom:34px}
.thanks{font-family:"Songti SC","STSong",Georgia,serif;font-size:25px;line-height:1.85;margin:0;font-weight:500}
.wish{font-size:15px;line-height:2;color:var(--muted);margin:31px 0 0}
.payment{margin-top:54px;padding:16px 26px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);min-width:230px}
.payment small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#989c95;margin-bottom:7px}
.payment strong{font-family:Georgia,serif;font-size:17px;font-weight:400}
.xhs{margin-top:54px;text-decoration:none;color:#687165;font-size:14px;letter-spacing:.02em}
.back-home{margin-top:26px;background:transparent;border:0;color:#8a8f87;font-size:12px;letter-spacing:.08em;padding:10px 14px}
.footer{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:10px;letter-spacing:.34em;color:rgba(53,58,52,.28)}
.fade{opacity:0;animation:fadeUp .9s ease forwards}
.d1{animation-delay:.08s}.d2{animation-delay:.28s}.d3{animation-delay:.52s}.d4{animation-delay:.78s}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-height:720px){
  .logo{margin-bottom:30px}.hero-copy{margin-top:38px}.weather{margin-top:42px}
  .tips{margin-top:70px}.thanks{font-size:23px}.payment{margin-top:38px}.xhs{margin-top:38px}
}
</style>
</head>
<body>

<section class="screen first" id="welcome">
  <i class="bead b1"></i><i class="bead b2"></i><i class="bead b3"></i><i class="bead b4"></i>
  <div class="inner">
    <div class="logo fade d1"><strong>YikeBeads</strong><small>DIY YOUR WAY</small></div>
    <p class="welcome fade d2">欢迎来到，YikeBeads。</p>
    <div class="hero-copy fade d3">
      <div class="hero-line one">一颗一颗，</div>
      <div class="hero-line two">拼虚度<span class="secret-link" id="secretLink" role="button" tabindex="0" aria-label="进入隐藏页">成形</span>。</div>
    </div>
    <div class="weather fade d4">Brisbane · 晴 <span class="temp">26°</span></div>
  </div>
</section>

<section class="screen second" id="info">
  <i class="bead b2"></i><i class="bead b5"></i><i class="bead b6"></i>
  <div class="inner">
    <div class="wifi">
      <p class="eyebrow">Wi‑Fi</p>
      <h2 class="network">TP-Link_ACB8</h2>
      <div class="row">
        <div class="password" id="password">••••••••</div>
        <div class="actions">
          <button id="showBtn" type="button">显示</button>
          <button id="copyBtn" type="button">复制</button>
        </div>
      </div>
    </div>
    <div class="tips">
      <h2>小提示</h2>
      <div class="tip"><span class="dot"></span><span>热茶和饮料请吧台自取</span></div>
      <div class="tip"><span class="dot"></span><span>零食就在桌上</span></div>
      <div class="tip"><span class="dot"></span><span>有任何需要 请随时叫我们</span></div>
    </div>
  </div>
</section>

<section class="screen hidden" id="hidden">
  <i class="bead b1"></i><i class="bead b4"></i><i class="bead b6"></i>
  <div class="inner">
    <div class="heart">🤍</div>
    <p class="thanks">谢谢你今天，<br>愿意把几个小时留给这里。</p>
    <p class="wish">愿虚度的时间，<br>慢慢成形。</p>
    <div class="payment"><small>Today's payment</small><strong id="payment">PayID · 0412 345 678</strong></div>
    <a class="xhs" href="https://xhslink.cn/m/ve2hwB1fj8" target="_blank" rel="noopener">◌ 欢迎留下今天完成的作品 ◌</a>
    <button class="back-home" id="backHome" type="button">返回首页</button>
  </div>
  <div class="footer">YikeBeads</div>
</section>

<script>
const WIFI_PASSWORD="fV25C4Rj";
const p=document.getElementById("password"),show=document.getElementById("showBtn"),copy=document.getElementById("copyBtn");
let open=false;
show.onclick=()=>{open=!open;p.textContent=open?WIFI_PASSWORD:"••••••••";show.textContent=open?"隐藏":"显示"};
copy.onclick=async()=>{try{await navigator.clipboard.writeText(WIFI_PASSWORD);copy.textContent="已复制";setTimeout(()=>copy.textContent="复制",1500)}catch(e){copy.textContent="请长按复制"}};
const payments=["PayID · 0412 345 678","Bank Transfer · YikeBeads","WeChat Pay · 今日可用"];
document.getElementById("payment").textContent=payments[new Date().getDate()%payments.length];
const secretLink=document.getElementById("secretLink");
const goHidden=()=>{secretLink.classList.remove("is-active");void secretLink.offsetWidth;secretLink.classList.add("is-active");setTimeout(()=>document.getElementById("hidden").scrollIntoView({behavior:"smooth"}),220);setTimeout(()=>secretLink.classList.remove("is-active"),850)};
secretLink.addEventListener("click",goHidden);
secretLink.addEventListener("keydown",(e)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();goHidden()}});
document.getElementById("backHome").addEventListener("click",()=>document.getElementById("welcome").scrollIntoView({behavior:"smooth"}));
</script>
</body>
</html>
