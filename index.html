<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#efeee8" />
  <title>YikeBeads Welcome</title>
  <style>
    :root{
      --bg:#efeee8;
      --paper:rgba(255,255,255,.68);
      --text:#343731;
      --muted:#7a7f77;
      --line:rgba(52,55,49,.10);
      --accent:#7f8c7b;
      --accent-soft:#dfe4dc;
      --shadow:0 18px 48px rgba(57,61,54,.07);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      color:var(--text);
      background:
        radial-gradient(circle at 15% 8%, rgba(255,255,255,.90), transparent 31%),
        radial-gradient(circle at 85% 22%, rgba(211,220,208,.45), transparent 28%),
        var(--bg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
                  "Hiragino Sans GB","Microsoft YaHei",sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    .page{
      width:min(100%,560px);
      margin:0 auto;
      padding:34px 20px calc(48px + env(safe-area-inset-bottom));
    }

    .hero{
      min-height:74vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:34px 16px 50px;
    }

    .logo{
      width:92px;
      height:92px;
      object-fit:cover;
      border-radius:50%;
      background:#fff;
      box-shadow:0 10px 28px rgba(53,56,50,.09);
      opacity:0;
      animation:fadeUp 1s ease .08s forwards;
    }

    .hello{
      margin:54px 0 0;
      font-size:16px;
      color:var(--muted);
      letter-spacing:.08em;
      opacity:0;
      animation:fadeUp 1s ease .38s forwards;
    }

    h1{
      margin:30px 0 0;
      font-size:clamp(34px,10vw,48px);
      line-height:1.2;
      font-weight:620;
      letter-spacing:-.04em;
      opacity:0;
      animation:fadeUp 1s ease .68s forwards;
    }

    .slogan{
      margin:54px 0 0;
      font-size:15px;
      color:#656a63;
      letter-spacing:.05em;
      opacity:0;
      animation:fadeUp 1s ease .98s forwards;
    }

    .season{
      margin:24px auto 0;
      max-width:330px;
      font-size:14px;
      line-height:1.85;
      color:var(--muted);
      opacity:0;
      animation:fadeUp 1s ease 1.18s forwards;
    }

    .dot{
      width:5px;
      height:5px;
      border-radius:50%;
      background:var(--accent);
      margin:0 auto 26px;
      opacity:.65;
    }

    .card{
      margin-top:18px;
      padding:24px;
      border-radius:28px;
      background:var(--paper);
      border:1px solid rgba(255,255,255,.78);
      box-shadow:var(--shadow);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
    }

    .label{
      margin:0 0 8px;
      font-size:11px;
      letter-spacing:.13em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .network{
      margin:0 0 24px;
      font-size:20px;
      font-weight:650;
    }

    .password-row{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .password{
      flex:1;
      min-width:0;
      padding:15px 16px;
      border-radius:16px;
      background:rgba(239,238,232,.82);
      border:1px solid var(--line);
      font-size:17px;
      font-weight:620;
      letter-spacing:.05em;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    button,a{
      font:inherit;
      -webkit-tap-highlight-color:transparent;
    }

    button{
      border:0;
      cursor:pointer;
      transition:transform .18s ease,background .18s ease;
    }

    button:active,.soft-link:active{transform:scale(.98)}

    .eye{
      width:48px;
      height:48px;
      flex:0 0 48px;
      border-radius:16px;
      background:#fff;
      color:var(--text);
      border:1px solid var(--line);
      font-size:18px;
    }

    .copy{
      width:100%;
      margin-top:12px;
      padding:15px 18px;
      border-radius:16px;
      background:var(--text);
      color:#fff;
      font-weight:620;
    }

    .copy.done{background:var(--accent)}

    .tips{
      margin-top:22px;
      padding:8px 4px 0;
    }

    .tips h2{
      margin:0 0 22px;
      font-size:16px;
      font-weight:620;
      letter-spacing:.02em;
    }

    .tip{
      display:flex;
      gap:13px;
      align-items:flex-start;
      padding:15px 0;
      border-bottom:1px solid var(--line);
      color:#5d625b;
      line-height:1.7;
      font-size:14px;
    }

    .tip:last-child{border-bottom:0}
    .tip-icon{width:24px;flex:0 0 24px}

    .thankyou{
      min-height:54vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      text-align:center;
      padding:80px 18px 72px;
    }

    .heart{
      font-size:20px;
      margin-bottom:26px;
    }

    .thankyou-main{
      margin:0;
      font-size:24px;
      line-height:1.75;
      font-weight:560;
      letter-spacing:-.02em;
    }

    .thankyou-sub{
      margin:28px 0 0;
      font-size:14px;
      line-height:1.8;
      color:var(--muted);
    }

    .xhs{
      padding:18px 4px 0;
      border-top:1px solid var(--line);
    }

    .xhs p{
      margin:0 0 16px;
      font-size:14px;
      line-height:1.8;
      color:#62675f;
    }

    .soft-link{
      display:inline-flex;
      align-items:center;
      gap:9px;
      color:var(--text);
      text-decoration:none;
      font-weight:620;
      transition:transform .18s ease,opacity .18s ease;
    }

    footer{
      text-align:center;
      padding:58px 10px 6px;
      color:var(--muted);
      font-size:12px;
      line-height:1.9;
      letter-spacing:.04em;
    }

    @keyframes fadeUp{
      from{opacity:0;transform:translateY(14px)}
      to{opacity:1;transform:translateY(0)}
    }

    @media(max-width:380px){
      .page{padding-left:15px;padding-right:15px}
      .hero{min-height:70vh}
      .card{padding:20px;border-radius:24px}
      .thankyou-main{font-size:22px}
    }

    @media(prefers-reduced-motion:reduce){
      *{animation:none!important;transition:none!important}
      .logo,.hello,h1,.slogan,.season{opacity:1}
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <img class="logo" src="4553.jpeg" alt="YikeBeads Logo" />
      <p class="hello" id="hello">欢迎来到 YikeBeads</p>
      <h1>慢慢拼。</h1>
      <p class="slogan">一颗一颗，拼虚度成形。</p>
      <p class="season" id="season">希望接下来的几个小时，可以慢慢拼，也慢慢放空。</p>
    </section>

    <div class="dot"></div>

    <section class="card" aria-label="Wi-Fi">
      <p class="label">Network</p>
      <p class="network">TP-Link_ACB8</p>

      <p class="label">Password</p>
      <div class="password-row">
        <div class="password" id="passwordText">••••••••</div>
        <button class="eye" id="togglePassword" type="button" aria-label="显示密码">◉</button>
      </div>

      <button class="copy" id="copyPassword" type="button">复制 Wi‑Fi 密码</button>
    </section>

    <section class="tips">
      <h2>小提示</h2>

      <div class="tip">
        <div class="tip-icon">🍵</div>
        <div>热茶和饮料都在吧台。</div>
      </div>

      <div class="tip">
        <div class="tip-icon">🥨</div>
        <div>零食就在桌上。</div>
      </div>

      <div class="tip">
        <div class="tip-icon">🙋</div>
        <div>有需要的话，随时叫我们。</div>
      </div>
    </section>

    <section class="thankyou">
      <div class="heart">🤍</div>
      <p class="thankyou-main">
        谢谢你今天，<br>
        愿意把几个小时留给这里。
      </p>
      <p class="thankyou-sub">
        希望今天，<br>
        也成为你喜欢的一天。
      </p>
    </section>

    <section class="xhs">
      <p>
        喜欢这里的话，<br>
        欢迎看看大家都拼了什么。
      </p>
      <a class="soft-link" href="https://xhslink.cn/m/ve2hwB1fj8" target="_blank" rel="noopener noreferrer">
        <span>去小红书看看</span>
        <span>→</span>
      </a>
    </section>

    <footer>
      YikeBeads<br>
      West End · Brisbane
    </footer>
  </main>

  <script>
    const WIFI_PASSWORD = "fV25C4Rj";
    const passwordText = document.getElementById("passwordText");
    const togglePassword = document.getElementById("togglePassword");
    const copyPassword = document.getElementById("copyPassword");
    const hello = document.getElementById("hello");
    const season = document.getElementById("season");

    let visible = false;

    const now = new Date();
    const brisbane = new Date(
      now.toLocaleString("en-US", { timeZone: "Australia/Brisbane" })
    );
    const hour = brisbane.getHours();
    const month = brisbane.getMonth() + 1;

    if (hour < 12) hello.textContent = "早上好，欢迎来到 YikeBeads";
    else if (hour < 18) hello.textContent = "下午好，欢迎来到 YikeBeads";
    else hello.textContent = "晚上好，欢迎来到 YikeBeads";

    const seasonalCopy = {
      12: "Brisbane 的夏天到了，先拿杯饮料，再慢慢开始吧。",
      1: "外面有点热，进来以后就慢一点吧。",
      2: "夏天还没走，今天也适合安静地拼几个小时。",
      3: "秋天刚刚开始，今天也慢慢来。",
      4: "天气渐渐舒服了，很适合坐下来慢慢拼。",
      5: "秋天很适合慢一点，也很适合完成一幅喜欢的图。",
      6: "外面有点凉，吧台有热茶，记得给自己倒一杯。",
      7: "Brisbane 的冬天不算太冷，一杯热茶刚刚好。",
      8: "冬天快结束了，希望今天也暖暖的。",
      9: "春天来了，今天也拼一点轻轻亮亮的颜色吧。",
      10: "天气开始变暖，慢慢拼，也慢慢享受今天。",
      11: "夏天快到了，先找个舒服的位置坐下来吧。"
    };

    season.textContent = seasonalCopy[month] ||
      "希望接下来的几个小时，可以慢慢拼，也慢慢放空。";

    togglePassword.addEventListener("click", () => {
      visible = !visible;
      passwordText.textContent = visible ? WIFI_PASSWORD : "••••••••";
      togglePassword.textContent = visible ? "◌" : "◉";
      togglePassword.setAttribute("aria-label", visible ? "隐藏密码" : "显示密码");
    });

    copyPassword.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(WIFI_PASSWORD);
      } catch {
        const area = document.createElement("textarea");
        area.value = WIFI_PASSWORD;
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        document.body.removeChild(area);
      }

      copyPassword.textContent = "✓ 已复制";
      copyPassword.classList.add("done");

      setTimeout(() => {
        copyPassword.textContent = "复制 Wi‑Fi 密码";
        copyPassword.classList.remove("done");
      }, 1800);
    });
  </script>
</body>
</html>
