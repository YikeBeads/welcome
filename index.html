<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f3ed">
<title>YikeBeads · V4 Preview</title>
<style>
:root {
  --bg:#f8f3ed;
  --ink:#4d4a43;
  --muted:#817d74;
  --sage:#7e8a69;
  --blue:#6f8796;
  --gold:#b88a49;
  --brown:#6c5b47;
  --line:rgba(76,72,64,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-snap-type:y mandatory}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
.screen{
  min-height:100svh;
  height:100svh;
  scroll-snap-align:start;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
}
.inner{width:min(100%,430px);margin:auto;position:relative;z-index:2}
.logo-img{
  display:block;
  width:154px;
  height:154px;
  object-fit:cover;
  border-radius:50%;
  margin:-22px auto 34px;
  mix-blend-mode:multiply;
}
.welcome{
  margin:0;
  text-align:center;
  color:var(--muted);
  font-size:14px;
  letter-spacing:.05em;
}
.hero-copy{
  width:min(310px,86vw);
  margin:52px auto 0;
  font-family:"Songti SC","STSong","Noto Serif CJK SC",Georgia,serif;
}
.hero-line{
  font-size:46px;
  line-height:1.34;
  font-weight:500;
  letter-spacing:.035em;
}
.hero-line.one{text-align:left}
.hero-line.two{text-align:right;margin-top:8px}
.secret-link{
  position:relative;
  display:inline-block;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  transition:color .18s ease,transform .16s ease;
}
.secret-link::after{
  content:"";
  position:absolute;
  left:50%;top:52%;
  width:12px;height:12px;
  border-radius:50%;
  background:rgba(126,138,105,.20);
  transform:translate(-50%,-50%) scale(.2);
  opacity:0;
  pointer-events:none;
}
.secret-link.pressed{color:var(--sage);transform:scale(.965)}
.secret-link.pressed::after{animation:ripple .52s ease-out forwards}
@keyframes ripple{
  0%{transform:translate(-50%,-50%) scale(.3);opacity:.48}
  100%{transform:translate(-50%,-50%) scale(7.5);opacity:0}
}

/* subtle hollow fuse beads */
.bead{
  position:absolute;
  width:14px;height:14px;
  border:2px solid currentColor;
  border-radius:50%;
  opacity:.075;
  z-index:1;
}
.bead::after{
  content:"";
  position:absolute;
  inset:3px;
  border:1px solid currentColor;
  border-radius:50%;
  opacity:.8;
}
.b1{left:-4px;top:15%;color:var(--sage);transform:rotate(8deg)}
.b2{right:8%;top:11%;width:11px;height:11px;color:var(--gold)}
.b3{left:9%;bottom:17%;width:10px;height:10px;color:var(--blue)}
.b4{right:-5px;bottom:27%;color:var(--brown)}
.b5{left:4%;top:58%;width:9px;height:9px;color:var(--gold)}
.b6{right:13%;top:49%;width:10px;height:10px;color:var(--sage)}
.b7{left:22%;top:7%;width:8px;height:8px;color:var(--blue)}
.b8{right:20%;bottom:7%;width:12px;height:12px;color:var(--gold)}

.second .inner{height:100%;display:flex;flex-direction:column;justify-content:center}
.wifi{
  width:100%;
  padding:28px 26px 25px;
  border-radius:28px;
  background:linear-gradient(145deg,rgba(255,255,255,.68),rgba(255,255,255,.34));
  border:1px solid rgba(255,255,255,.70);
  box-shadow:0 18px 55px rgba(73,68,58,.07);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}
.eyebrow{
  margin:0 0 16px;
  font-size:11px;
  letter-spacing:.17em;
  color:#969087;
}
.network{
  margin:0 0 24px;
  font-family:Georgia,serif;
  font-size:27px;
  font-weight:400;
}
.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  border-top:1px solid var(--line);
  padding-top:18px;
}
.password{font-size:20px;letter-spacing:.12em}
.actions{display:flex;gap:8px}
button{
  border:0;
  background:rgba(112,123,108,.10);
  color:#697263;
  border-radius:999px;
  padding:9px 12px;
  font-size:12px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.tips{margin-top:112px;padding:0 4px}
.tips h2{
  margin:0 0 22px;
  font-family:"Songti SC","STSong",Georgia,serif;
  font-size:23px;
  font-weight:500;
}
.tip{
  display:grid;
  grid-template-columns:20px 1fr;
  gap:12px;
  padding:13px 0;
  color:#66645e;
  font-size:15px;
  line-height:1.65;
}
.tip + .tip{border-top:1px solid rgba(76,72,64,.055)}
.dot{
  width:7px;height:7px;
  border:1.5px solid var(--sage);
  border-radius:50%;
  margin-top:8px;
  opacity:.75;
}

/* real hidden page overlay — no scrolling/jumping */
.hidden-overlay{
  position:fixed;
  inset:0;
  z-index:999;
  height:100svh;
  min-height:100svh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) 24px calc(22px + env(safe-area-inset-bottom));
  background:var(--bg);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transform:translateZ(0) scale(1.012);
  transition:
    opacity .32s ease,
    transform .42s cubic-bezier(.22,1,.36,1),
    visibility 0s linear .42s;
}
.hidden-overlay.open{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transform:translateZ(0) scale(1);
  transition:
    opacity .32s ease,
    transform .42s cubic-bezier(.22,1,.36,1),
    visibility 0s;
}
body.secret-open{overflow:hidden;touch-action:none}
.hidden-inner{
  width:min(100%,430px);
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  z-index:2;
}
.heart{font-size:19px;margin-bottom:32px}
.thanks{
  margin:0;
  font-family:"Songti SC","STSong",Georgia,serif;
  font-size:24px;
  line-height:1.86;
  font-weight:500;
}
.wish{
  margin:29px 0 0;
  color:var(--muted);
  font-size:15px;
  line-height:2;
}
.payment-card{
  width:min(310px,90%);
  margin-top:46px;
  padding:20px 22px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.payment-label{
  margin:0 0 12px;
  font-size:10px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:#969087;
}
.payment-type{
  margin:0 0 10px;
  font-family:Georgia,serif;
  font-size:17px;
  font-weight:400;
}
.payment-details{
  margin:0;
  white-space:pre-line;
  font-size:14px;
  line-height:1.75;
  color:#65625b;
}
.copy-payment{margin-top:14px}
.xhs{
  margin-top:42px;
  text-decoration:none;
  color:#687165;
  font-size:14px;
  letter-spacing:.02em;
}
.back-home{
  margin-top:24px;
  background:transparent;
  color:#8a867e;
  letter-spacing:.06em;
}
.footer{
  position:absolute;
  left:0;right:0;
  bottom:calc(16px + env(safe-area-inset-bottom));
  text-align:center;
  color:rgba(76,72,64,.25);
  font-size:10px;
  letter-spacing:.34em;
}
.fade{opacity:0;animation:fadeUp .9s ease forwards}
.d1{animation-delay:.06s}.d2{animation-delay:.24s}.d3{animation-delay:.46s}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-height:720px){
  .logo-img{width:132px;height:132px;margin-bottom:30px}
  .hero-copy{margin-top:38px}
  .hero-line{font-size:38px}
  .tips{margin-top:72px}
  .payment-card{margin-top:34px}
  .xhs{margin-top:30px}
}
</style>
</head>

<script>
(() => {
  const WIFI_PASSWORD = "fV25C4Rj";
  const wifiPassword = document.getElementById("wifiPassword");
  const showWifi = document.getElementById("showWifi");
  const copyWifi = document.getElementById("copyWifi");
  let wifiShown = false;

  showWifi.addEventListener("click", () => {
    wifiShown = !wifiShown;
    wifiPassword.textContent = wifiShown ? WIFI_PASSWORD : "••••••••";
    showWifi.textContent = wifiShown ? "隐藏" : "显示";
  });

  async function copyText(text, button) {
    try {
      await navigator.clipboard.writeText(text);
      const old = button.textContent;
      button.textContent = "已复制 ✓";
      setTimeout(() => button.textContent = old, 1400);
    } catch {
      const old = button.textContent;
      button.textContent = "请长按复制";
      setTimeout(() => button.textContent = old, 1600);
    }
  }
  copyWifi.addEventListener("click", () => copyText(WIFI_PASSWORD, copyWifi));

  const payments = [
    {type:"PayID", details:"0420470550\nCheng Z", copy:"0420470550"},
    {type:"PayID", details:"0451545322\nMeng W", copy:"0451545322"},
    {type:"PayID", details:"0405018756\nLyu Y", copy:"0405018756"},
    {type:"Bank Transfer", details:"Account Name: CHENG S\nBSB: 014111\nAccount Number: 802268105", copy:"802268105"}
  ];
  const todaysPayment = payments[(new Date().getDate() - 1) % payments.length];
  document.getElementById("paymentType").textContent = todaysPayment.type;
  document.getElementById("paymentDetails").textContent = todaysPayment.details;
  const copyPayment = document.getElementById("copyPayment");
  copyPayment.addEventListener("click", () => copyText(todaysPayment.copy, copyPayment));

  const secretLink = document.getElementById("secretLink");
  const hiddenPage = document.getElementById("hiddenPage");
  let transitionLocked = false;

  function openHidden() {
    if (transitionLocked || hiddenPage.classList.contains("open")) return;
    transitionLocked = true;
    secretLink.classList.add("pressed");
    setTimeout(() => {
      hiddenPage.classList.add("open");
      hiddenPage.setAttribute("aria-hidden", "false");
      document.body.classList.add("secret-open");
    }, 150);
    setTimeout(() => {
      secretLink.classList.remove("pressed");
      transitionLocked = false;
    }, 620);
  }

  function closeHidden() {
    if (transitionLocked || !hiddenPage.classList.contains("open")) return;
    transitionLocked = true;
    hiddenPage.classList.remove("open");
    hiddenPage.setAttribute("aria-hidden", "true");
    document.body.classList.remove("secret-open");
    setTimeout(() => transitionLocked = false, 430);
  }

  secretLink.addEventListener("click", openHidden);
  secretLink.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      openHidden();
    }
  });
  document.getElementById("backHome").addEventListener("click", closeHidden);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeHidden();
  });
})();
</script>
